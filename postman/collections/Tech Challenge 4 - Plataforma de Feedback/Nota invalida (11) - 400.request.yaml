$kind: http-request
url: "{{baseUrl}}/api/avaliacao"
method: POST
headers:
  Content-Type: application/json
  x-functions-key: "{{functionKey}}"
body:
  type: json
  content: |-
    {
      "descricao": "Aula",
      "nota": 11
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 4000
