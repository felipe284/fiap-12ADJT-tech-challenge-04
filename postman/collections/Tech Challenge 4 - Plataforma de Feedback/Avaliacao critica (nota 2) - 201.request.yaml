$kind: http-request
url: "{{baseUrl}}/api/avaliacao"
method: POST
headers:
  Content-Type: application/json
  x-functions-key: "{{functionKey}}"
body:
  type: json
  content: |-
    {
      "descricao": "Aula confusa e audio ruim",
      "nota": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', function () { pm.response.to.have.status(201); });
      pm.test('Urgencia CRITICA', function () { pm.expect(pm.response.json().urgencia).to.eql('CRITICA'); });
    language: text/javascript
order: 1000
