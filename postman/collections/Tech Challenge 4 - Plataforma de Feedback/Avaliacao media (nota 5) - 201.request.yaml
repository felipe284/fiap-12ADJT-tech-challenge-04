$kind: http-request
url: "{{baseUrl}}/api/avaliacao"
method: POST
headers:
  Content-Type: application/json
  x-functions-key: "{{functionKey}}"
body:
  type: json
  content: |-
    {
      "descricao": "Aula razoavel",
      "nota": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', function () { pm.response.to.have.status(201); });
      pm.test('Urgencia MEDIA', function () { pm.expect(pm.response.json().urgencia).to.eql('MEDIA'); });
    language: text/javascript
order: 2000
